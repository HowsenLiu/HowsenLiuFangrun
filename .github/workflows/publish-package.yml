name: Publish font package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: true
        default: "2.000"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Release font assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p package/fonts/desktop package/fonts/web
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            -o release.json
          python3 - <<'PY'
          import json, os, urllib.request

          rel = json.load(open("release.json", encoding="utf-8"))
          web_assets = {"HowsenLiuFangrun-WOFF2.zip"}

          for asset in rel["assets"]:
            name = asset["name"]
            dest = "package/fonts/web" if name in web_assets else "package/fonts/desktop"
            print("Downloading:", name)
            urllib.request.urlretrieve(asset["browser_download_url"], os.path.join(dest, name))

          print("Release tag:", rel["tag_name"])
          PY
          cp LICENSE package/fonts/LICENSE-OFL-1.1.txt
          find package/fonts -type f -printf '%P\t%s bytes\n' | sort

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push font bundle image
        uses: docker/build-push-action@v6
        with:
          context: package
          push: true
          tags: |
            ghcr.io/howsenliu/howsenliu-fangrun:${{ inputs.version || '2.000' }}
            ghcr.io/howsenliu/howsenliu-fangrun:latest
          labels: |
            org.opencontainers.image.title=HowsenLiu Fangrun
            org.opencontainers.image.description=Free OFL 1.1 font bundles: desktop TTF/TTC/variable TTF and web WOFF2
            org.opencontainers.image.licenses=OFL-1.1
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
