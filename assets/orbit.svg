<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" role="img" aria-label="Abstract brand motion: rounded square orbit">
  <style>
    .fg    { stroke: #1d1d1f; }
    .track { stroke: #e6e8eb; }
    .gold  { stroke: #c8a45d; }
    .dot   { fill: #c8a45d; }
    @media (prefers-color-scheme: dark) {
      .fg    { stroke: #f5f5f7; }
      .track { stroke: #30363d; }
    }
  </style>

  <!-- breathing rings -->
  <circle cx="600" cy="110" r="96" fill="none" class="track" stroke-width="1.5">
    <animate attributeName="opacity" values="0.25;0.6;0.25" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="110" r="118" fill="none" class="track" stroke-width="1">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="6s" begin="-3s" repeatCount="indefinite"/>
  </circle>

  <!-- outer rounded square, slow rotation -->
  <g fill="none" class="fg" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" values="0 600 110;360 600 110" dur="30s" repeatCount="indefinite"/>
    <rect x="535" y="45" width="130" height="130" rx="30"/>
  </g>

  <!-- inner rounded square, counter rotation -->
  <g fill="none" class="gold" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" values="360 600 110;0 600 110" dur="20s" repeatCount="indefinite"/>
    <rect x="561" y="71" width="78" height="78" rx="22"/>
  </g>

  <!-- orbiting gold dot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 600 110;360 600 110" dur="8s" repeatCount="indefinite"/>
    <circle cx="656" cy="110" r="7" class="dot"/>
  </g>
</svg>
