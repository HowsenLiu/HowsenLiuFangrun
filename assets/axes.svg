<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="100%" height="250" role="img" aria-label="Variable axes animation">
  <style>
    .fg   { fill: #1d1d1f; }
    .sub  { fill: #6a737d; }
    .track{ stroke: #e6e8eb; }
    .thumb{ fill: #c8a45d; stroke: #1d1d1f; stroke-width: 1.5; }
    .lab  { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .fg   { fill: #f5f5f7; }
      .sub  { fill: #9aa5b1; }
      .track{ stroke: #30363d; }
      .thumb{ stroke: #f5f5f7; }
    }
  </style>

  <!-- wght -->
  <text x="40" y="62" class="lab fg" font-size="26" font-weight="600">wght</text>
  <text x="40" y="88" class="lab sub" font-size="17">weight · default 400</text>
  <line x1="300" y1="70" x2="1050" y2="70" stroke-width="6" stroke-linecap="round" class="track"/>
  <circle class="thumb" r="12" cx="300" cy="70">
    <animate attributeName="cx" values="300;1050;300" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="1160" y="78" text-anchor="end" class="lab sub" font-size="20">100–700</text>

  <!-- wdth -->
  <text x="40" y="132" class="lab fg" font-size="26" font-weight="600">wdth</text>
  <text x="40" y="158" class="lab sub" font-size="17">width · default 100</text>
  <line x1="300" y1="140" x2="1050" y2="140" stroke-width="6" stroke-linecap="round" class="track"/>
  <circle class="thumb" r="12" cx="300" cy="140">
    <animate attributeName="cx" values="300;1050;300" keyTimes="0;0.5;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
  </circle>
  <text x="1160" y="148" text-anchor="end" class="lab sub" font-size="20">75–105</text>

  <!-- opsz -->
  <text x="40" y="202" class="lab fg" font-size="26" font-weight="600">opsz</text>
  <text x="40" y="228" class="lab sub" font-size="17">optical size · default 16</text>
  <line x1="300" y1="210" x2="1050" y2="210" stroke-width="6" stroke-linecap="round" class="track"/>
  <circle class="thumb" r="12" cx="300" cy="210">
    <animate attributeName="cx" values="300;1050;300" keyTimes="0;0.5;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
  </circle>
  <text x="1160" y="218" text-anchor="end" class="lab sub" font-size="20">12–72</text>
</svg>
