<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="100%" height="28" role="img" aria-label="Animated sweeping underline">
  <defs>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8a45d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8a45d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c8a45d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .track { stroke: #e6e8eb; }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #30363d; }
    }
  </style>
  <line x1="0" y1="14" x2="1200" y2="14" stroke-width="1" class="track"/>
  <rect x="0" y="11" width="220" height="4" rx="2" fill="url(#sweepGrad)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M -220 14 H 1200"/>
  </rect>
</svg>
